# Vendored from https://github.com/PlumeImpactor/omnisette at rev c066ac2.
# Modifications:
#   - Inlined workspace.dependencies (sha2, base64, rand, plist, thiserror) with
#     explicit versions so this can live as a path dep outside its original workspace.
#   - Prefer per-device v3 provisioning; discover Apple's MID URLs with client
#     identity headers and report provisioning failures without panicking.
[package]
name = "omnisette"
version = "0.1.0"
edition = "2021"

[features]
remote-anisette = []
async = ["dep:async-trait"]
default = ["remote-anisette", "dep:remove-async-await"]
remote-anisette-v3 = ["async", "dep:serde", "dep:serde_json", "dep:tokio-tungstenite", "dep:tokio", "dep:futures-util", "dep:chrono"]
aos-kit = []

[dependencies]
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
plist = "1.8.0"
thiserror = "2"

hex = "0.4"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
uuid = { version = "1.3", features = [ "v4", "fast-rng", "macro-diagnostics" ] }
android-loader = { git = "https://github.com/Dadoum/android-loader", branch = "bigger_pages" }
libc = "0.2"
log = "0.4"
async-trait = { version = "0.1", optional = true }
remove-async-await = { version = "1.0", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0.115", optional = true }
tokio-tungstenite = { version = "0.27.0", optional = true, features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1.43", optional = true, features = ["time"] }
futures-util = { version = "0.3.28", optional = true }
chrono = { version = "0.4.37", optional = true }
anyhow = "1.0.81"

[target.'cfg(target_os = "macos")'.dependencies]
dlopen2 = "0.4"
objc = "0.2"
objc-foundation = "0.1"
