# Vendored from https://github.com/bitxeno/PlumeImpactor (crates/plume_utils) at
# tag v2.2.3-patch.4 -- this is the IPA-signing orchestration layer (bundle
# walking, entitlement merging, codesign, re-zip) that our vendored plume_core
# (from a different fork, BoardTM/PlumeImpactor -- see
# rust/vendor/plume_core/Cargo.toml) doesn't include.
#
# Modifications from upstream:
#   - inlined `*.workspace = true` fields (this is no longer a workspace member)
#   - dropped `device.rs` (USB/lockdown install via idevice + usbmuxd) and its
#     `idevice`/`plume_store` deps: we already have our own WiFi-only install
#     path (see rust/ffi/src/install.rs, over AFC + installation_proxy through
#     the RemotePairing tunnel), and no other file here references device.rs,
#     idevice, or plume_store.
#   - `plume_core` path dependency points at our vendored copy instead of a
#     sibling workspace member; no `tweaks` feature needed since our fork
#     doesn't gate `MachO` behind one (unlike upstream's plume_core).
[package]
name = "plume_utils"
description = "Utility functions and types for Impactor tools."
edition = "2024"
version = "2.2.2"
authors = ["CLARATION <claration@riseup.net>"]
license = "MIT"
repository = "https://github.com/bitxeno/PlumeImpactor"

[dependencies]
thiserror = "2.0"
uuid = "1.18"
plist = "1.8"
tokio = { version = "1.43", features = ["fs", "sync"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
goblin = "0.9"
plume_core = { path = "../plume_core" }
regex = "1.11.2"

zip = { version = "4.3", default-features = false, features = ["deflate"] }
decompress = { git = "https://github.com/PlumeImpactor/decompress", rev = "75a3016" }
flate2 = "1.1"
